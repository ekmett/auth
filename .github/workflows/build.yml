name: Build and documentation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths-ignore:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install LLVM and build tools
        run: |
          curl --fail --location --retry 3 https://apt.llvm.org/llvm.sh --output "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install --no-install-recommends -y clang-tools-21 libssl-dev graphviz
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/python" -m pip install cmake==4.4.3 ninja==1.13.0
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Install Doxygen
        run: |
          curl --fail --location --retry 3 \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            --output "$RUNNER_TEMP/doxygen.tar.gz"
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/doxygen"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP/doxygen" --strip-components=1
          echo "$RUNNER_TEMP/doxygen/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DAUTH_BUILD_TESTS=ON -DAUTH_BUILD_DOCS=ON \
            '-DCMAKE_CXX_FLAGS=-Wall -Wextra -Werror'
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --no-tests=error --output-on-failure
      - name: Build documentation
        run: |
          cmake --build build --target auth_docs
          touch build/docs/html/.nojekyll
      - name: Retain documentation and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/docs/html/
            build/docs/warnings.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs/html
          retention-days: 1

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Visual Studio environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            "-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DAUTH_BUILD_TESTS=ON -DAUTH_BUILD_DOCS=OFF `
            "-DOPENSSL_ROOT_DIR=$env:ProgramFiles/OpenSSL" `
            "-DCMAKE_CXX_FLAGS=/W4 /WX /EHsc -Wno-unused-command-line-argument"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --no-tests=error --output-on-failure
      - name: Retain Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
